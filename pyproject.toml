[project]
name = "hj-prox-reproduction"
version = "0.1.0"
description = "Claim-level reproduction of arXiv:2601.22370"
requires-python = "==3.12.*"
dependencies = [
  "marimo>=0.15,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reproduction"]
